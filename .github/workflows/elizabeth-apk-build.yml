name: Build Elizabeth v1.1 APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'elizabeth-build/**'
      - '.github/workflows/elizabeth-apk-build.yml'

permissions:
  contents: write

jobs:
  build-elizabeth-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out build bench
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inspect prior signing paths
        shell: bash
        run: |
          set +e
          mkdir -p signing-diagnostics/prior-apks
          {
            echo '=== Existing build-bench workflow signing references ==='
            find .github/workflows -maxdepth 1 -type f -print -exec grep -HniE 'keystore|signing|storePassword|keyPassword|keyAlias|SIGNING|KEYSTORE|assembleRelease|apksigner' {} \; 2>/dev/null
            echo
            echo '=== Repository files that look like signing material ==='
            find . -type f \( -iname '*.jks' -o -iname '*.keystore' -o -iname '*.p12' -o -iname '*.pkcs12' -o -iname 'keystore.properties' \) -print 2>/dev/null
            echo
            echo '=== Elizabeth public release assets ==='
            curl -fsSL https://api.github.com/repos/PulsePointLabs/Elizabeth-RPM/releases > signing-diagnostics/releases.json
            jq -r '.[] | .tag_name as $tag | .assets[]? | [$tag,.name,.browser_download_url] | @tsv' signing-diagnostics/releases.json | tee signing-diagnostics/release-assets.tsv
            echo
            echo '=== Download and inspect older Elizabeth APK certificates ==='
            jq -r '.[] | .tag_name as $tag | .assets[]? | select(.name | ascii_downcase | endswith(".apk")) | [$tag,.name,.browser_download_url] | @tsv' signing-diagnostics/releases.json | head -10 | while IFS=$'\t' read -r tag name url; do
              safe="$(printf '%s-%s' "$tag" "$name" | tr '/ :' '___')"
              echo "Downloading $tag / $name"
              curl -fL "$url" -o "signing-diagnostics/prior-apks/$safe"
              echo "--- $tag / $name ---"
              "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs "signing-diagnostics/prior-apks/$safe" 2>&1
              sha256sum "signing-diagnostics/prior-apks/$safe"
            done
          } 2>&1 | tee signing-diagnostics/signing-report.txt

      - name: Upload signing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Elizabeth-signing-diagnostics
          path: |
            signing-diagnostics/signing-report.txt
            signing-diagnostics/releases.json
            signing-diagnostics/release-assets.tsv
          if-no-files-found: warn

      - name: Clone Elizabeth source
        run: git clone --depth 1 https://github.com/PulsePointLabs/Elizabeth-RPM.git source

      - name: Decode v1.1 sensor patch
        run: |
          base64 --decode elizabeth-build/elizabeth-v1.1.patch.xz.b64 > elizabeth-v1.1.patch.xz
          xz --test elizabeth-v1.1.patch.xz
          xz --decompress --stdout elizabeth-v1.1.patch.xz > elizabeth-v1.1.patch
          git -C source apply --check ../elizabeth-v1.1.patch

      - name: Apply v1.1 sensor patch
        run: git -C source apply ../elizabeth-v1.1.patch

      - name: Build installable APK
        working-directory: source
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare downloadable files
        run: |
          mkdir -p release
          cp source/app/build/outputs/apk/debug/app-debug.apk release/Elizabeth-Live-v1.1.0-sensor-pages.apk
          sha256sum release/Elizabeth-Live-v1.1.0-sensor-pages.apk > release/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elizabeth-Live-v1.1.0-sensor-pages
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: elizabeth-v1.1.0-sensor-pages
          target_commitish: ${{ github.event.pull_request.head.sha }}
          name: Elizabeth Live v1.1.0 Sensor Pages
          body: |
            Installable APK built from PulsePointLabs/Elizabeth-RPM with the swipeable landscape sensor-pages patch.
          files: |
            release/Elizabeth-Live-v1.1.0-sensor-pages.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
