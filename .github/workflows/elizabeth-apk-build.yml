name: Build Elizabeth v1.1 APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'elizabeth-build/**'
      - '.github/workflows/elizabeth-apk-build.yml'

permissions:
  contents: write

jobs:
  build-elizabeth-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build bench
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clone Elizabeth source
        run: git clone --depth 1 https://github.com/PulsePointLabs/Elizabeth-RPM.git source

      - name: Decode and inspect v1.1 sensor patch
        shell: bash
        run: |
          set +e
          {
            echo '--- encoded file ---'
            wc -c elizabeth-build/elizabeth-v1.1.patch.xz.b64
            sha256sum elizabeth-build/elizabeth-v1.1.patch.xz.b64
            base64 --decode elizabeth-build/elizabeth-v1.1.patch.xz.b64 > elizabeth-v1.1.patch.xz
            echo "base64_status=$?"
            echo '--- xz file ---'
            wc -c elizabeth-v1.1.patch.xz
            sha256sum elizabeth-v1.1.patch.xz
            xz --test elizabeth-v1.1.patch.xz
            echo "xz_test_status=$?"
            xz --decompress --stdout elizabeth-v1.1.patch.xz > elizabeth-v1.1.patch
            echo "xz_decode_status=$?"
            echo '--- decoded patch ---'
            wc -c elizabeth-v1.1.patch
            sha256sum elizabeth-v1.1.patch
            git -C source apply --check --verbose ../elizabeth-v1.1.patch
            echo "git_apply_check_status=$?"
          } 2>&1 | tee patch-debug.log

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Elizabeth-patch-diagnostics
          path: patch-debug.log
          if-no-files-found: error

      - name: Apply v1.1 sensor patch
        run: |
          xz --test elizabeth-v1.1.patch.xz
          git -C source apply --check ../elizabeth-v1.1.patch
          git -C source apply ../elizabeth-v1.1.patch

      - name: Test, lint, and build APK
        working-directory: source
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Prepare downloadable files
        run: |
          mkdir -p release
          cp source/app/build/outputs/apk/debug/app-debug.apk release/Elizabeth-Live-v1.1.0-sensor-pages.apk
          sha256sum release/Elizabeth-Live-v1.1.0-sensor-pages.apk > release/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elizabeth-Live-v1.1.0-sensor-pages
          path: release/*
          if-no-files-found: error

      - name: Publish temporary GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: elizabeth-v1.1.0-sensor-pages-build
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" release/* \
            --target "$TARGET_SHA" \
            --title "Elizabeth Live v1.1.0 Sensor Pages" \
            --notes "Installable debug-signed APK built from PulsePointLabs/Elizabeth-RPM with the swipeable landscape sensor-pages patch."
